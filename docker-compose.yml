version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: redis_container
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - flicklog-network

  mongodb:
    image: mongo:latest
    container_name: mongo_container
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - flicklog-network

  server:
    build: ./server
    container_name: server_container
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_URL: mongodb://mongodb:27017/flicklog
      REACT_APP_DOMAIN: http://localhost:3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      - mongodb
      - redis
    networks:
      - flicklog-network

  client:
    build: ./client
    container_name: client_container
    restart: always
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: https://localhost:5000
    depends_on:
      - server
    networks:
      - flicklog-network

volumes:
  redis_data:
    driver: local
  mongo_data:
    driver: local

networks:
  flicklog-network:
    driver: bridge